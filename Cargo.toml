[package]
name = "httpsig-diff"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Differential harness for HTTP Message Signatures (RFC 9421) canonicalization across Rust crates"
publish = false

[dependencies]
# Implementations under test, pinned to the versions that were read.
web-bot-auth = "=0.7.0"
wimsey-httpsig = "=0.9.0"
aauth = { package = "aauth-httpsig", version = "=0.1.2" }
# Reference implementation.
sfv = "0.13"
ed25519-dalek = "2.2"
base64 = "0.22"
form_urlencoded = "1.2"
sha2 = "0.10"
serde_json = "1"
